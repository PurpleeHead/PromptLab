<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101014" />
    <meta name="description" content="PromptLab is your workspace to create, organize, and reuse better AI prompts." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PromptLab — AI Prompt Workspace" />
    <meta property="og:description" content="Create, organize, preview, and reuse prompt templates in a local-first workspace." />
    <script>
      try {
        const savedLocale = localStorage.getItem('promptlab:locale:v1');
        document.documentElement.lang =
          savedLocale === 'en' || savedLocale === 'ru'
            ? savedLocale
            : navigator.language.toLowerCase().startsWith('ru') ? 'ru' : 'en';
      } catch {
        document.documentElement.lang =
          navigator.language.toLowerCase().startsWith('ru') ? 'ru' : 'en';
      }
    </script>
    <title>PromptLab — AI Prompt Workspace</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
